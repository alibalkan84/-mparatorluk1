name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare app directory structure
        run: |
          mkdir -p app/src/main/java/com/kayiobasi/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/mipmap-hdpi
          [ -f AndroidManifest.xml ] && cp AndroidManifest.xml app/src/main/
          [ -f MainActivity.java ] && cp MainActivity.java app/src/main/java/com/kayiobasi/app/
          [ -f index.html ] && cp index.html app/src/main/assets/
          [ -f ic_launcher.png ] && cp ic_launcher.png app/src/main/res/mipmap-hdpi/

      - name: Configure Android Gradle files
        run: |
          cat << 'EOF' > settings.gradle
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
            repositories {
              google()
              mavenCentral()
            }
          }
          rootProject.name = "KayiObasi"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle
          plugins {
            id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
            id 'com.android.application'
          }

          android {
            namespace 'com.kayiobasi.app'
            compileSdk 34

            defaultConfig {
              applicationId "com.kayiobasi.app"
              minSdk 24
              targetSdk 34
              versionCode 1
              versionName "1.0"
            }

            buildTypes {
              release {
                minifyEnabled false
              }
            }

            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }

          dependencies {
            implementation 'androidx.appcompat:appcompat:1.7.0'
            implementation 'com.google.android.material:material:1.12.0'
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/*.apk"
          
